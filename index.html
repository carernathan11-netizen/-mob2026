<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOB'2026 — Info Manifs & Mobilisations en Direct</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#FF3B30',
                            amber: '#FF9500',
                            dark: '#0D0F12',
                            card: '#161920',
                            border: '#262B36'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(22, 25, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- BANDEROLLE FLASH INFO -->
    <div class="bg-brand-red/10 border-b border-brand-red/30 py-2.5 px-4 text-xs md:text-sm font-medium text-red-400">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 overflow-hidden">
            <div class="flex items-center gap-2 shrink-0">
                <span class="w-2.5 h-2.5 rounded-full bg-brand-red pulse-red"></span>
                <span class="font-bold tracking-wider uppercase text-brand-red">FLASH INFO</span>
            </div>
            <div class="truncate text-slate-300">
                <span>Appels à rassemblements pour le 24 octobre : la carte des villes actualisée en temps réel.</span>
            </div>
            <span class="text-slate-500 text-xs shrink-0 hidden sm:inline">Direct 2026</span>
        </div>
    </div>

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 glass-panel border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-red to-brand-amber flex items-center justify-center font-black text-xl text-white shadow-lg shadow-brand-red/20">
                    M
                </div>
                <div>
                    <a href="#" class="font-extrabold text-xl tracking-tight text-white flex items-center gap-1.5">
                        MOB<span class="text-brand-red">'26</span>
                    </a>
                    <p class="text-[10px] text-slate-400 tracking-wider uppercase -mt-1 font-semibold">Live Social Tracker</p>
                </div>
            </div>

            <!-- ZONE D'AUTHENTIFICATION GOOGLE -->
            <div class="flex items-center gap-3">
                <!-- Bouton Connexion Google (Affiché si déconnecté) -->
                <button id="btn-login" class="bg-white hover:bg-slate-100 text-slate-900 font-bold text-xs py-2 px-3.5 rounded-xl flex items-center gap-2 transition shadow-md">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Connexion Google
                </button>

                <!-- Bloc Profil (Affiché si connecté) -->
                <div id="user-profile" class="hidden flex items-center gap-2 bg-brand-card border border-brand-border p-1.5 rounded-xl">
                    <img id="user-avatar" src="" alt="Avatar" class="w-7 h-7 rounded-lg border border-slate-700">
                    <span id="user-name" class="text-xs font-bold text-white hidden sm:inline"></span>
                    <button id="btn-logout" class="text-slate-400 hover:text-red-400 text-xs px-2" title="Déconnexion">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- SECTION CONTRIBUTION (Visible si connecté) -->
        <section id="section-contrib" class="hidden glass-panel p-5 rounded-2xl border border-brand-border space-y-3">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-brand-red"></i> Publier une information sur le direct
            </h3>
            <div class="flex gap-2">
                <input id="input-info" type="text" placeholder="Entrez un point d'info ou un signalement..." class="flex-1 bg-brand-dark border border-brand-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-brand-red">
                <button id="btn-send-info" class="bg-brand-red hover:bg-red-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition">
                    Envoyer
                </button>
            </div>
        </section>

        <!-- FIL D'ACTUALITÉ EN DIRECT -->
        <section id="direct" class="space-y-4">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span> Live Feed
            </h2>
            <div id="live-feed-list" class="space-y-3">
                <!-- Les messages s'ajouteront ici depuis Google Database -->
                <p class="text-xs text-slate-500 italic">Connectez-vous avec Google pour publier et lire les informations partagées en temps réel.</p>
            </div>
        </section>

    </main>

    <!-- INTEGRATION GOOGLE FIREBASE AUTH & DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURATION GOOGLE FIREBASE (À remplacer par tes clés de projet Google Console)
        const firebaseConfig = {
            apiKey: "TA_CLE_API_GOOGLE",
            authDomain: "ton-projet.firebaseapp.com",
            projectId: "ton-projet-id",
            storageBucket: "ton-projet.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Éléments HTML
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userProfile = document.getElementById('user-profile');
        const userName = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        const sectionContrib = document.getElementById('section-contrib');

        // 1. Connexion Google
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => console.error("Erreur de connexion:", error));
        });

        // 2. Déconnexion
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // 3. Écouteur du statut d'authentification
        onAuthStateChanged(auth, user => {
            if (user) {
                // Utilisateur Connecté
                btnLogin.classList.add('hidden');
                userProfile.classList.remove('hidden');
                sectionContrib.classList.remove('hidden');

                userName.textContent = user.displayName;
                userAvatar.src = user.photoURL;
            } else {
                // Utilisateur Déconnecté
                btnLogin.classList.remove('hidden');
                userProfile.classList.add('hidden');
                sectionContrib.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
